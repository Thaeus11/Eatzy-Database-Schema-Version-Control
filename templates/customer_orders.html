<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eatzy - My Orders</title>
  <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Poppins", sans-serif; }
    body { background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url("/static/images/bg.png") no-repeat center center/cover; min-height: 100vh; }

    /* HEADER */
    .header {
      background: transparent; color: white;
      padding: 18px 25px; display: flex; justify-content: space-between; align-items: center;
      box-shadow: none;
      position: sticky; top: 0; z-index: 100; backdrop-filter: none; border-bottom: none;
    }
    .header h1 { font-size: 26px; }
    .header-nav { display: flex; gap: 20px; }
    .header-nav a { color: white; text-decoration: none; font-weight: 500; transition: 0.2s; }
    .header-nav a:hover { opacity: 0.8; }

    /* MAIN CONTENT */
    .container { max-width: 1000px; margin: 30px auto; padding: 20px; }

    h2 { color: white; margin-bottom: 30px; font-size: 28px; }

    /* ORDERS LIST */
    .orders-list { display: flex; flex-direction: column; gap: 20px; }
    .order-card {
      background: rgba(255,255,255,0.1); border-radius: 15px; overflow: hidden;
      box-shadow: 0 4px 18px rgba(0,0,0,0.2); padding: 20px; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2);
    }

    .order-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 2px solid rgba(255,255,255,0.2); padding-bottom: 15px; }
    .order-number { font-weight: 700; color: #a8d8ff; font-size: 18px; }
    .order-status {
      padding: 8px 16px; border-radius: 20px; font-weight: 600; font-size: 13px;
      background: rgba(168,216,255,0.2); color: #a8d8ff;
    }
    .status-pending { background: rgba(255,193,7,0.3); color: #ffeb3b; }
    .status-preparing { background: rgba(33,150,243,0.3); color: #90caf9; }
    .status-delivered { background: rgba(76,175,80,0.3); color: #81c784; }
    .status-out { background: rgba(0,188,212,0.3); color: #80deea; }

    .order-details { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 15px; }
    .detail-item { }
    .detail-label { color: rgba(255,255,255,0.7); font-size: 13px; }
    .detail-value { color: white; font-weight: 600; }

    .order-items { background: rgba(255,255,255,0.1); padding: 15px; border-radius: 10px; margin-bottom: 15px; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); }
    .items-title { font-weight: 700; color: #a8d8ff; margin-bottom: 10px; }
    .item { padding: 8px 0; color: rgba(255,255,255,0.9); font-size: 14px; }

    .order-actions { display: flex; gap: 10px; }
    .btn { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; transition: 0.2s; }
    .btn-track { background: rgba(255,255,255,0.15); color: white; border: 2px solid rgba(255,255,255,0.4); border-radius: 8px; }
    .btn-track:hover { background: #1556b8; }

    .empty { text-align: center; padding: 50px 20px; color: rgba(255,255,255,0.9); }

    @media(max-width: 720px) {
      .header { flex-wrap: wrap; gap: 10px; }
      .header-nav { flex-direction: column; gap: 10px; width: 100%; }
      .order-header { flex-direction: column; align-items: flex-start; gap: 10px; }
      .order-details { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <!-- HEADER -->
  <div style="position:sticky;top:0;z-index:100;background:transparent;box-shadow:none;display:flex;align-items:center;padding:18px 25px;">
    <a href="/customer/home" style="display:inline-flex;align-items:center;text-decoration:none;">
      <img src="/static/images/logo.png" alt="Eatzy" style="width:60px;height:60px;object-fit:cover;border-radius:50%;background:rgba(255,255,255,0.12);box-shadow:0 2px 8px rgba(0,0,0,0.10);padding:6px;border:2px solid rgba(255,255,255,0.25);margin-right:18px;">
    </a>
    <h1 style="margin:0;color:white;">Eatzy</h1>
  </div>
  <div class="header-nav" style="display:flex;gap:20px;justify-content:flex-end;align-items:center;padding:18px 25px 0 25px;">
    <a href="/customer/home">Browse</a>
    <a href="/customer/profile">Profile</a>
    <a href="/logout">Logout</a>
  </div>

  <!-- MAIN CONTENT -->
  <div class="container">
    <h2>Your Orders</h2>
    <div class="orders-list" id="ordersContainer">
      <div class="empty">Loading your orders...</div>
    </div>
  </div>

  <script>
    const statusClasses = {
      'Pending': 'status-pending',
      'Preparing': 'status-preparing',
      'Out for Delivery': 'status-out',
      'Delivered': 'status-delivered'
    };

    async function loadOrders() {
      const container = document.getElementById('ordersContainer');
      try {
        console.log('Fetching orders...');
        const response = await fetch('/api/customer/orders');
        console.log('Response status:', response.status, response.statusText);
        
        if (!response.ok) {
          const errorData = await response.json().catch(() => ({}));
          console.error('API Error:', errorData);
          throw new Error(`HTTP ${response.status}: ${errorData.message || response.statusText}`);
        }
        
        const orders = await response.json();
        console.log('Orders received:', orders);
        
        if (!Array.isArray(orders)) {
          console.error('Orders is not an array:', orders);
          container.innerHTML = '<div class="empty">Error: Invalid response format.</div>';
          return;
        }
        
        if (orders.length === 0) {
          console.log('No orders found');
          container.innerHTML = '<div class="empty">No orders yet. <a href="/customer/home" style="color: #a8d8ff; text-decoration: none; font-weight: 600;">Start ordering now!</a></div>';
          return;
        }
        
        container.innerHTML = '';
        
        orders.forEach(order => {
          const statusClass = statusClasses[order.status] || '';
          const card = document.createElement('div');
          card.className = 'order-card';
          card.innerHTML = `
            <div class="order-header">
              <div class="order-number">${order.order_number}</div>
              <div class="order-status ${statusClass}">${order.status}</div>
            </div>
            <div class="order-details">
              <div class="detail-item">
                <div class="detail-label">📍 Delivery Address</div>
                <div class="detail-value">${order.delivery_address || 'N/A'}</div>
              </div>
              <div class="detail-item">
                <div class="detail-label">💳 Payment Method</div>
                <div class="detail-value">${order.payment_method || 'N/A'}</div>
              </div>
              <div class="detail-item">
                <div class="detail-label">💰 Total</div>
                <div class="detail-value">₱${order.total || 'N/A'}</div>
              </div>
              <div class="detail-item">
                <div class="detail-label">📅 Ordered</div>
                <div class="detail-value">${new Date(order.created_at).toLocaleDateString()}</div>
              </div>
            </div>
            <div class="order-items">
              <div class="items-title">Items Ordered:</div>
              ${Array.isArray(order.items) ? order.items.map(item => `
                <div class="item">• ${item.name} x${item.quantity} - ₱${item.price}</div>
              `).join('') : '<div class="item">Items information not available</div>'}
            </div>
            <div class="order-actions">
              <button class="btn btn-track" onclick="trackOrder('${order.id}')">Track Delivery</button>
            </div>
          `;
          container.appendChild(card);
        });
      } catch (error) {
        console.error('Error loading orders:', error.message);
        container.innerHTML = '<div class="empty">Error: ' + error.message + '</div>';
      }
    }

    function trackOrder(orderId) {
      window.location.href = `/track-delivery?order_id=${orderId}`;
    }

    // Load orders on page load
    loadOrders();
  </script>
</body>
</html>
