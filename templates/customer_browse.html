<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse Restaurants - Eatzy</title>
  <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
  <style>
    body { font-family: Poppins, sans-serif; background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url("/static/images/bg.png") no-repeat center center/cover; margin:0; padding:20px; min-height: 100vh; }
    header { display:flex; justify-content:space-between; align-items:center; padding:12px 20px; background:transparent; color:#fff; border-radius:8px; backdrop-filter:none; border: none; }
    header a { color:#fff; text-decoration:none; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; margin-top:20px; }
    .card { background:rgba(255,255,255,0.1); padding:12px; border-radius:10px; box-shadow:0 6px 18px rgba(0,0,0,0.2); backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,0.2); color:white; }
    .card h3 { margin:0 0 8px 0; font-size:18px; }
    .card p { margin:0 0 12px 0; color:rgba(255,255,255,0.9); font-size:14px; }
    .btn { display:inline-block; padding:8px 12px; background:rgba(255,255,255,0.15); color:#fff; border-radius:8px; text-decoration:none; border:2px solid rgba(255,255,255,0.4); }
    #status { margin-top:14px; color:rgba(255,255,255,0.9); }
  </style>
</head>
<body>
  <header style="display:flex;align-items:center;justify-content:space-between;background:transparent;color:#fff;padding:12px 20px;border-radius:8px;">
    <div style="display:flex;align-items:center;">
      <a href="/customer/home" style="display:inline-flex;align-items:center;text-decoration:none;">
        <img src="/static/images/logo.png" alt="Eatzy" style="width:60px;height:60px;object-fit:cover;border-radius:50%;background:rgba(255,255,255,0.12);box-shadow:0 2px 8px rgba(0,0,0,0.10);padding:6px;border:2px solid rgba(255,255,255,0.25);margin-right:18px;">
      </a>
      <div style="font-weight:700;font-size:1.5rem;">Browse Restaurants</div>
    </div>
    <div>
      <a href="/customer/home" style="color:#fff; text-decoration:none; margin-right:12px;">Dashboard</a>
      <a href="/logout" style="color:#fff; text-decoration:none;">Logout</a>
    </div>
  </header>

  <main>
    <div id="status" style="margin-top:14px;color:#444;">Loading restaurants...</div>
    <div class="grid" id="restaurants"></div>
  </main>

  <script>
    async function loadRestaurants() {
      try {
        const res = await fetch('/api/restaurants');
        if (!res.ok) throw new Error('Failed to fetch');
        const data = await res.json();
        const container = document.getElementById('restaurants');
        container.innerHTML = '';
        if (!data || data.length === 0) {
          document.getElementById('status').textContent = 'No restaurants available.';
          return;
        }
        document.getElementById('status').textContent = '';
        data.forEach(r => {
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <h3>${r.name}</h3>
            <p>${r.description || ''}</p>
            <div style="display:flex;gap:8px;align-items:center;">
              <a class="btn" href="/customer/order/${r.id}">View Menu</a>
              <div style="margin-left:auto;color:#888;">⭐ ${r.rating || '—'}</div>
            </div>
          `;
          container.appendChild(card);
        });
      } catch (err) {
        document.getElementById('status').textContent = 'Error loading restaurants.';
        console.error(err);
      }
    }
    loadRestaurants();
  </script>
</body>
</html>
