<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eatzy - Restaurant Dashboard</title>
  <link rel="icon" type="image/x-icon" href="/static/favicon.ico">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Poppins", sans-serif; }

    /* BACKGROUND IMAGE */
    body {
      min-height: 100vh;
      background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url("/static/images/bg.png") no-repeat center center/cover;
      display: flex;
    }

    body::before {
      content: none;
    }

    /* SIDEBAR */
    .sidebar {
      width: 260px;
      background: rgba(255, 255, 255, 0.1);
      color: white;
      padding: 25px 20px;
      display: flex;
      flex-direction: column;
      gap: 30px;
      position: fixed;
      height: 100vh;
      box-shadow: 3px 0 12px rgba(0,0,0,0.2);
      border-right: 1px solid rgba(255,255,255,0.2);
      backdrop-filter: blur(10px);
    }

    .logo img {
      width: 150px;
      height: 150px;
      object-fit: cover;
      border-radius: 50%;
      background: rgba(255,255,255,0.12);
      box-shadow: 0 2px 8px rgba(0,0,0,0.10);
      padding: 8px;
      border: 2px solid rgba(255,255,255,0.25);
    }

    .sidebar a {
      text-decoration: none;
      color: white;
      padding: 12px 15px;
      display: block;
      border-radius: 8px;
      font-size: 16px;
      transition: 0.3s;
    }

    .sidebar a:hover {
      background: rgba(255,255,255,0.2);
      color: #1e6ce6;
      transform: translateX(5px);
    }

    /* MAIN CONTENT */
    .main {
      margin-left: 260px;
      padding: 30px;
      width: 100%;
      color: white;
    }

    h2 {
      margin-bottom: 25px;
      font-size: 32px;
      font-weight: 700;
      text-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }

    /* DASHBOARD CARDS */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 25px;
      margin-bottom: 40px;
    }

    .card {
      background: rgba(255,255,255,0.08);
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.2);
      border: 1px solid rgba(255,255,255,0.15);
      transition: 0.3s;
      backdrop-filter: blur(10px);
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.35);
    }

    .card-title {
      font-size: 16px;
      opacity: 0.9;
      margin-bottom: 10px;
    }

    .card-value {
      font-size: 34px;
      font-weight: 700;
    }

    /* TABLES */
    .table-box {
      background: rgba(255,255,255,0.08);
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.2);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.15);
      color: white;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    table th, table td {
      padding: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      text-align: left;
      font-size: 15px;
    }

    table th {
      background: rgba(255,255,255,0.08);
      border-radius: 8px;
    }

    @media(max-width: 900px) {
      .sidebar { display: none; }
      .main { margin-left: 0; }
    }
  </style>
</head>

<body>



  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="logo" style="display:flex;justify-content:center;align-items:center;margin-bottom:20px;">
      <img src="/static/images/logo.png" alt="Eatzy">
    </div>
    <!-- Dashboard link removed -->
    <a href="/restaurant/menu">Manage Menu</a>
    <a href="/restaurant/orders">Orders</a>
    <a href="/restaurant/profile">Profile</a>
    <a href="/logout">Logout</a>
  </div>

  <!-- MAIN AREA -->
  <div class="main">
    <h2 id="restaurantName">Restaurant Dashboard</h2>

    <!-- CARDS -->
    <div class="cards">
      <div class="card">
        <div class="card-title">Total Orders</div>
        <div class="card-value" id="totalOrders">0</div>
      </div>

      <div class="card">
        <div class="card-title">Active Orders</div>
        <div class="card-value" id="activeOrders">0</div>
      </div>

      <div class="card">
        <div class="card-title">Today's Revenue</div>
        <div class="card-value" id="todayRevenue">₱0</div>
      </div>

      <div class="card">
        <div class="card-title">Menu Items</div>
        <div class="card-value" id="menuCount">0</div>
      </div>
    </div>

    <!-- RECENT ORDERS -->
    <div class="table-box">
      <h3 style="font-size:22px; margin-bottom:10px;">Recent Orders</h3>
      <table>
        <thead>
          <tr>
            <th>Order #</th>
            <th>Customer</th>
            <th>Total</th>
            <th>Status</th>
            <th>Date</th>
          </tr>
        </thead>
        <tbody id="recentOrders">
          <tr><td colspan="5" style="text-align:center;padding:20px;color:#ddd;">Loading...</td></tr>
        </tbody>
      </table>
    </div>

  </div>

  <script>
    async function loadDashboard() {
      try {
        const res = await fetch('/api/restaurant/dashboard');
        const data = await res.json();

        document.getElementById('restaurantName').textContent = data.name + " - Dashboard";
        document.getElementById('totalOrders').textContent = data.total_orders;
        document.getElementById('activeOrders').textContent = data.active_orders;
        document.getElementById('todayRevenue').textContent = "₱" + data.today_revenue;
        document.getElementById('menuCount').textContent = data.menu_count;

        const body = document.getElementById('recentOrders');
        body.innerHTML = '';

        data.recent_orders.forEach(order => {
          let tr = document.createElement("tr");
          tr.innerHTML = `
            <td>#${order.id}</td>
            <td>${order.customer}</td>
            <td>₱${order.total}</td>
            <td>${order.status}</td>
            <td>${order.date}</td>
          `;
          body.appendChild(tr);
        });

      } catch (err) {
        console.error("Dashboard load error:", err);
      }
    }

    loadDashboard();
  </script>

</body>
</html>
